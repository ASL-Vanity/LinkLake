# cargo-deny 会把可发布工作区包中未声明版本的 path 依赖视为 wildcard。
# 本分支不能修改 Cargo.toml，因此逐项登记并由脚本直接核对 cargo metadata；新增项仍会失败。
[[wildcard_exception]]
crate = "linklake-client"
dependency = "linklake-core"
manifest = "crates/linklake-client/Cargo.toml"
reason = "Existing workspace path dependency omits a publishable version; add an exact compatible version in the dedicated dependency-policy change."
expires = 2026-08-17

[[wildcard_exception]]
crate = "linklake-client"
dependency = "linklake-update"
manifest = "crates/linklake-client/Cargo.toml"
reason = "Existing workspace path dependency omits a publishable version; add an exact compatible version in the dedicated dependency-policy change."
expires = 2026-08-17

[[wildcard_exception]]
crate = "linklake-server"
dependency = "linklake-core"
manifest = "crates/linklake-server/Cargo.toml"
reason = "Existing workspace path dependency omits a publishable version; add an exact compatible version in the dedicated dependency-policy change."
expires = 2026-08-17

[[wildcard_exception]]
crate = "linklake-server"
dependency = "linklake-update"
manifest = "crates/linklake-server/Cargo.toml"
