name: Reliability soak

on:
  schedule:
    - cron: '20 18 * * 6'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Soak duration in minutes
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: reliability-soak
  cancel-in-progress: false

jobs:
  windows-soak:
    name: Windows reliability soak
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SOAK_MINUTES: ${{ github.event.inputs.duration_minutes || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup default 1.91.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-soak-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-soak-
      - name: Run crash, restart, concurrency, weak-network and throughput soak
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\reliability-matrix.ps1 `
            -Profile soak -DurationMinutes ([int]$env:SOAK_MINUTES) `
            -OutputPath .\tests\soak-results.json
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-soak-report
          path: tests/soak-results.json
          if-no-files-found: warn
