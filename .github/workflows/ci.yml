name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  license-compliance:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about
          key: linux-license-cargo-about-0.9.1-${{ hashFiles('Cargo.lock', 'about.toml') }}
          restore-keys: linux-license-cargo-about-0.9.1-
      - name: Install cargo-about
        run: command -v cargo-about >/dev/null || cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Generate locked Rust dependency licenses
        run: node scripts/generate-third-party-licenses.mjs target/THIRD_PARTY_LICENSES.html
      - name: Verify committed license document
        run: cmp target/THIRD_PARTY_LICENSES.html THIRD_PARTY_LICENSES.html

  linux-quality:
    name: Linux quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Verify root restore preserves each service-owned state root
        run: |
          set -eu
          cargo test -p linklake-server --no-run --locked
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -name 'linklake_server-*' -perm -111 -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$test_bin"
          sudo "$test_bin" disaster_recovery::tests::root_database_restore_preserves_database_owner_and_uses_data_owner_when_missing --exact
          sudo "$test_bin" disaster_recovery::tests::root_full_restore_preserves_each_managed_owner_for_nested_files --exact
      - name: Verify development release-signing fixture
        run: |
          set -eu
          fixture=target/release-signing-fixture
          version=0.8.0-rc.1
          mkdir -p "$fixture"
          printf 'core package fixture\n' >"$fixture/linklake-$version-linux-x86_64.tar.gz"
          printf 'manager package fixture\n' >"$fixture/linklake-manager-$version-linux-x86_64.tar.gz"
          export LINKLAKE_TEST_SIGNING_KEY_B64="$(jq -r .seed_base64 security/test-fixtures/development-signing-key.json)"
          cargo run --locked -p linklake-update --bin linklake-release-sign -- \
            generate --dist "$fixture" --version "$version" \
            --key-id linklake-development-rfc8032-1 \
            --signing-key-env LINKLAKE_TEST_SIGNING_KEY_B64 \
            --minimum-updater-version 0.8.0-rc.1 \
            --allow-development-key
          cargo run --locked -p linklake-update --bin linklake-release-sign -- \
            verify --dist "$fixture" --allow-development-key
          if cargo run --locked -p linklake-update --bin linklake-release-sign -- \
            verify --dist "$fixture"; then
            echo 'production policy unexpectedly accepted the development key' >&2
            exit 1
          fi
      - name: Check shell scripts
        run: find packaging scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Verify macOS Manager host integration contract
        run: node --test tests/manager-macos-contract.test.mjs

  windows-test:
    name: Windows test and tunnel E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${_}: $($_.Message)" }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Run updater replacement and rollback end-to-end tests
        shell: pwsh
        run: |
          ./tests/version-contract.ps1 -SkipBuild
          ./tests/update-e2e.ps1 -Product client
          ./tests/update-e2e.ps1 -Product server
          ./tests/manager-update-e2e.ps1 -SkipBuild
      - name: Run encrypted disaster-recovery end-to-end tests
        shell: pwsh
        run: ./tests/disaster-recovery-e2e.ps1 -SkipBuild
      - name: Run TCP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\tcp-e2e.ps1
      - name: Run UDP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\udp-e2e.ps1
      - name: Run HTTP route and forward proxy end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\http-e2e.ps1 -SkipBuild
      - name: Run HTTP/2 and gRPC end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\http2-grpc-e2e.ps1
      - name: Run managed configuration end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\managed-config-e2e.ps1 -SkipBuild
      - name: Run TLS SNI pass-through end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\sni-e2e.ps1 -SkipBuild
      - name: Run secret tunnel end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\secret-e2e.ps1 -SkipBuild
      - name: Run SOCKS5 TCP/UDP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\socks5-e2e.ps1 -SkipBuild

  macos-test:
    name: macOS build and unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Run unit tests
        run: cargo test --workspace --locked

  flutter-manager:
    name: Flutter manager (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/linklake_manager
        run: flutter pub get
      - name: Analyze Flutter manager
        working-directory: apps/linklake_manager
        run: flutter analyze
      - name: Test Flutter manager
        working-directory: apps/linklake_manager
        run: flutter test
      - name: Build Flutter manager
        working-directory: apps/linklake_manager
        env:
          FLUTTER_TARGET: ${{ matrix.target }}
        run: flutter build "$FLUTTER_TARGET" --release

  linux-https-acme-e2e:
    name: Linux HTTPS/ACME E2E
    runs-on: ubuntu-latest
    needs: linux-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Run HTTPS and ACME end-to-end tests with Pebble
        shell: pwsh
        run: ./tests/https-e2e.ps1
