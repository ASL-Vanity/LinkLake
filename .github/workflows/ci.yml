name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-quality:
    name: Linux quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Check shell scripts
        run: find packaging scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

  windows-test:
    name: Windows test and TCP/UDP/HTTP E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${_}: $($_.Message)" }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Run TCP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\tcp-e2e.ps1
      - name: Run UDP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\udp-e2e.ps1 -SkipBuild
      - name: Run HTTP end-to-end tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\http-e2e.ps1 -SkipBuild

  linux-https-acme-e2e:
    name: Linux HTTPS/ACME E2E
    runs-on: ubuntu-latest
    needs: linux-quality
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Run HTTPS and ACME end-to-end tests with Pebble
        shell: pwsh
        run: ./tests/https-e2e.ps1
