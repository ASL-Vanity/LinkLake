name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LINKLAKE_GIT_COMMIT: ${{ github.sha }}
  SYFT_VERSION: v1.50.0
  COSIGN_VERSION: v3.0.5

jobs:
  ci-gate:
    name: Reuse CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-gate:
    name: Reuse security gates
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  windows-package:
    name: Windows release packages
    runs-on: windows-latest
    env:
      LINKLAKE_WINDOWS_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup default 1.91.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Build Windows package
        shell: powershell
        env:
          LINKLAKE_WINDOWS_SIGNING_PFX_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_PFX_B64 || '' }}
          LINKLAKE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_PFX_PASSWORD || '' }}
          LINKLAKE_WINDOWS_SIGNING_CERT_SHA256: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1
      - name: Verify Windows package
        shell: powershell
        run: |
          $required = $env:LINKLAKE_WINDOWS_SIGNING_REQUIRED -eq 'true'
          .\scripts\verify-windows-package.ps1 -RequireAuthenticode:$required
      - name: Build Flutter manager Windows package
        shell: powershell
        env:
          LINKLAKE_WINDOWS_SIGNING_PFX_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_PFX_B64 || '' }}
          LINKLAKE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_PFX_PASSWORD || '' }}
          LINKLAKE_WINDOWS_SIGNING_CERT_SHA256: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.LINKLAKE_WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-manager-windows.ps1
      - name: Verify Flutter manager Windows package
        shell: powershell
        run: |
          $required = $env:LINKLAKE_WINDOWS_SIGNING_REQUIRED -eq 'true'
          .\scripts\verify-manager-windows.ps1 -RequireAuthenticode:$required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  linux-package:
    name: Linux release packages
    runs-on: ubuntu-latest
    env:
      LINKLAKE_LINUX_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.91.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-release-
      - name: Install Flutter Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Build Linux package
        run: bash scripts/package-linux.sh
      - name: Verify Linux package
        run: bash scripts/verify-linux-package.sh
      - name: Build DEB and RPM packages
        run: sh scripts/package-native-linux.sh
      - name: Verify DEB and RPM packages
        run: sh scripts/verify-native-linux-packages.sh
      - name: Verify container image builds
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('validation-{0}', github.sha) }}
        run: docker build -t "linklake:$RELEASE_TAG" .
      - name: Build Flutter manager Linux package
        run: sh scripts/package-manager-linux.sh
      - name: Verify Flutter manager Linux package
        run: sh scripts/verify-manager-linux.sh
      - name: Sign Linux release packages with OpenPGP
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINKLAKE_LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINKLAKE_LINUX_GPG_PRIVATE_KEY_B64 }}
          LINKLAKE_LINUX_GPG_PASSPHRASE: ${{ secrets.LINKLAKE_LINUX_GPG_PASSPHRASE }}
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/sign-linux-artifacts.sh
      - name: Verify Linux OpenPGP signatures without the private key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/verify-linux-release-signatures.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.asc
            dist/*.asc.sha256
          if-no-files-found: error

  macos-package:
    name: macOS release packages
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      LINKLAKE_MACOS_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.91.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-release-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Prepare temporary Developer ID and notarization credentials
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          LINKLAKE_MACOS_SIGNING_CERT_P12_B64: ${{ secrets.LINKLAKE_MACOS_SIGNING_CERT_P12_B64 }}
          LINKLAKE_MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.LINKLAKE_MACOS_SIGNING_CERT_PASSWORD }}
          LINKLAKE_MACOS_SIGNING_IDENTITY: ${{ secrets.LINKLAKE_MACOS_SIGNING_IDENTITY }}
          LINKLAKE_MACOS_SIGNING_CERT_SHA256: ${{ secrets.LINKLAKE_MACOS_SIGNING_CERT_SHA256 }}
          LINKLAKE_APPLE_API_KEY_P8_B64: ${{ secrets.LINKLAKE_APPLE_API_KEY_P8_B64 }}
          LINKLAKE_APPLE_API_KEY_ID: ${{ secrets.LINKLAKE_APPLE_API_KEY_ID }}
          LINKLAKE_APPLE_API_ISSUER_ID: ${{ secrets.LINKLAKE_APPLE_API_ISSUER_ID }}
        run: sh scripts/setup-macos-signing.sh
      - name: Build macOS package
        run: sh scripts/package-macos.sh
      - name: Verify macOS package
        run: sh scripts/verify-macos-package.sh
      - name: Build Flutter manager macOS package
        run: sh scripts/package-manager-macos.sh
      - name: Verify Flutter manager macOS package
        run: sh scripts/verify-manager-macos.sh
      - name: Remove temporary macOS signing credentials
        if: always()
        run: sh scripts/cleanup-macos-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-macos
          path: |
            dist/*-macos-*.tar.gz
            dist/*-macos-*.tar.gz.sha256
          if-no-files-found: error

  container-package:
    name: Publish signed GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ci-gate
      - security-gate
      - windows-package
      - linux-package
      - macos-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v*) version="${TAG#v}";; *) echo 'release tag must start with v' >&2; exit 1;; esac
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'tags<<EOF\n%s:%s\n%s:sha-%s\n' "$image" "$version" "$image" "$GITHUB_SHA"
            case "$version" in *-*) :;; *) printf '%s:latest\n' "$image";; esac
            printf 'EOF\n'
          } >>"$GITHUB_OUTPUT"
      - name: Build and push OCI image with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=linklake-release-image
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Create GitHub image provenance attestation
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Keyless-sign and verify the immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          cosign sign --yes "$IMAGE@$DIGEST"
          identity="https://github.com/$REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST"
      - name: Record immutable container evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -eu
          mkdir -p container-evidence
          evidence="container-evidence/container-image-$VERSION.txt"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >"$evidence"
          (cd container-evidence && sha256sum "$(basename "$evidence")" >"$(basename "$evidence").sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-container-image
          path: container-evidence/*
          if-no-files-found: error

  publish:
    name: Sign, attest, and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ci-gate
      - security-gate
      - windows-package
      - linux-package
      - macos-package
      - container-package
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建或更新由当前标签标识的 GitHub Release。
      id-token: write # 获取短期 OIDC 身份，用于 Sigstore 签署证明。
      attestations: write # 将 provenance 与 SBOM 证明写入 GitHub Attestations API。
      artifact-metadata: write # 为被证明的发布资产登记 GitHub 元数据。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.91.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Resolve immutable release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "release tag must start with v" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          test -n "$version"
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Reverify Linux OpenPGP signatures after artifact transfer
        env:
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/verify-linux-release-signatures.sh dist "$RELEASE_VERSION"
      - name: Generate per-package SPDX SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: node scripts/generate-package-sboms.mjs dist "$RELEASE_VERSION"
      - name: Verify packages and prepare attestation subjects
        run: node scripts/prepare-release-attestations.mjs dist "$RELEASE_VERSION"
      - name: Create and verify production Ed25519 release manifest
        env:
          LINKLAKE_RELEASE_SIGNING_KEY_B64: ${{ secrets.LINKLAKE_RELEASE_SIGNING_KEY_B64 }}
          LINKLAKE_RELEASE_SIGNING_KEY_ID: ${{ secrets.LINKLAKE_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -eu
          test -n "$LINKLAKE_RELEASE_SIGNING_KEY_B64" || { echo "production signing key secret is required" >&2; exit 1; }
          test -n "$LINKLAKE_RELEASE_SIGNING_KEY_ID" || { echo "production signing key ID secret is required" >&2; exit 1; }
          cargo run --locked -p linklake-update --bin linklake-release-sign -- \
            generate --dist dist --version "$RELEASE_VERSION" \
            --key-id "$LINKLAKE_RELEASE_SIGNING_KEY_ID" \
            --minimum-updater-version 0.8.0-rc.1
      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/linklake-${{ env.RELEASE_VERSION }}-release-subjects.sha256
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/linklake-${{ env.RELEASE_VERSION }}-release-subjects.sha256
          sbom-path: dist/linklake-${{ env.RELEASE_VERSION }}-release.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *-rc.* ]]; then
              gh release create "$TAG" \
                --title "LinkLake $TAG" \
                --verify-tag \
                --generate-notes \
                --notes $'> [!WARNING]\n> This release candidate is protected by SHA-256, Linux OpenPGP, GitHub attestations, GHCR Cosign, and the production Ed25519 updater manifest. Windows Authenticode and Apple Developer ID/notarization remain mandatory for v1.0.0 but are not yet attached to this RC.\n\n> 此候选版已使用 SHA-256、Linux OpenPGP、GitHub Attestation、GHCR Cosign 与生产 Ed25519 更新清单保护。Windows Authenticode 与 Apple Developer ID/公证仍是 v1.0.0 的强制门禁，但本 RC 暂未附带。' \
                --prerelease
            else
              gh release create "$TAG" --title "LinkLake $TAG" --verify-tag --generate-notes --latest
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
