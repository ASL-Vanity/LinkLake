name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LINKLAKE_GIT_COMMIT: ${{ github.sha }}
  SYFT_VERSION: v1.50.0
  COSIGN_VERSION: v3.0.5

jobs:
  ci-gate:
    name: Reuse CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-gate:
    name: Reuse security gates
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  windows-package:
    name: Windows unsigned release packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup default 1.91.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Build Windows package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -WindowsSigningMode none
      - name: Verify Windows package integrity (unsigned policy)
        shell: powershell
        run: .\scripts\verify-windows-package.ps1
      - name: Build Flutter manager Windows package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-manager-windows.ps1 -WindowsSigningMode none
      - name: Verify Flutter manager Windows package integrity (unsigned policy)
        shell: powershell
        run: .\scripts\verify-manager-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  linux-package:
    name: Linux release packages
    runs-on: ubuntu-latest
    env:
      LINKLAKE_LINUX_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.91.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-release-
      - name: Install Flutter Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Build Linux package
        run: bash scripts/package-linux.sh
      - name: Verify Linux package
        run: bash scripts/verify-linux-package.sh
      - name: Build DEB and RPM packages
        run: sh scripts/package-native-linux.sh
      - name: Verify DEB and RPM packages
        run: sh scripts/verify-native-linux-packages.sh
      - name: Verify native DEB package install and upgrade contract
        run: sh tests/run-native-linux-package-contracts.sh deb
      - name: Verify native RPM package install and upgrade contract
        run: sh tests/run-native-linux-package-contracts.sh rpm
      - name: Verify container image builds
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('validation-{0}', github.sha) }}
        run: docker build -t "linklake:$RELEASE_TAG" .
      - name: Build Flutter manager Linux package
        run: sh scripts/package-manager-linux.sh
      - name: Verify Flutter manager Linux package
        run: sh scripts/verify-manager-linux.sh
      - name: Sign Linux release packages with OpenPGP
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINKLAKE_LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINKLAKE_LINUX_GPG_PRIVATE_KEY_B64 }}
          LINKLAKE_LINUX_GPG_PASSPHRASE: ${{ secrets.LINKLAKE_LINUX_GPG_PASSPHRASE }}
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/sign-linux-artifacts.sh
      - name: Verify Linux OpenPGP signatures without the private key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/verify-linux-release-signatures.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.asc
            dist/*.asc.sha256
          if-no-files-found: error

  container-package:
    name: Publish signed GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ci-gate
      - security-gate
      - windows-package
      - linux-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR with the job token
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v*) version="${TAG#v}";; *) echo 'release tag must start with v' >&2; exit 1;; esac
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'tags<<EOF\n%s:%s\n%s:sha-%s\n' "$image" "$version" "$image" "$GITHUB_SHA"
            case "$version" in *-*) :;; *) printf '%s:latest\n' "$image";; esac
            printf 'EOF\n'
          } >>"$GITHUB_OUTPUT"
      - name: Build and push OCI image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=linklake-release-image
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Create GitHub image provenance attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Keyless-sign and verify the immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          cosign sign --yes "$IMAGE@$DIGEST"
          identity="https://github.com/$REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST"
      - name: Record immutable container evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -eu
          mkdir -p container-evidence
          evidence="container-evidence/container-image-$VERSION.txt"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >"$evidence"
          (cd container-evidence && sha256sum "$(basename "$evidence")" >"$(basename "$evidence").sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linklake-container-image
          path: container-evidence/*
          if-no-files-found: error

  publish:
    name: Sign, attest, and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ci-gate
      - security-gate
      - windows-package
      - linux-package
      - container-package
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建或更新由当前标签标识的 GitHub Release。
      id-token: write # 获取短期 OIDC 身份，用于 Sigstore 签署证明。
      attestations: write # 将 provenance 与 SBOM 证明写入 GitHub Attestations API。
      artifact-metadata: write # 为被证明的发布资产登记 GitHub 元数据。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.91.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: 'linklake-*'
          merge-multiple: true
      - name: Resolve immutable release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "release tag must start with v" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          numeric_identifier='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_pattern="^${numeric_identifier}\\.${numeric_identifier}\\.${numeric_identifier}(-${prerelease_identifier}(\\.${prerelease_identifier})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo 'release tag must contain a valid semantic version after v' >&2
            exit 1
          fi
          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            printf 'RELEASE_VERSION=%s\n' "$version"
            printf 'RELEASE_PRERELEASE=%s\n' "$prerelease"
          } >> "$GITHUB_ENV"
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Reverify Linux OpenPGP signatures after artifact transfer
        env:
          LINKLAKE_LINUX_GPG_FINGERPRINT: ${{ secrets.LINKLAKE_LINUX_GPG_FINGERPRINT }}
        run: sh scripts/verify-linux-release-signatures.sh dist "$RELEASE_VERSION"
      - name: Generate per-package SPDX SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: node scripts/generate-package-sboms.mjs dist "$RELEASE_VERSION"
      - name: Verify packages and prepare attestation subjects
        run: node scripts/prepare-release-attestations.mjs dist "$RELEASE_VERSION"
      - name: Create and verify production Ed25519 release manifest
        env:
          LINKLAKE_RELEASE_SIGNING_KEY_B64: ${{ secrets.LINKLAKE_RELEASE_SIGNING_KEY_B64 }}
          LINKLAKE_RELEASE_SIGNING_KEY_ID: ${{ secrets.LINKLAKE_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -eu
          test -n "$LINKLAKE_RELEASE_SIGNING_KEY_B64" || { echo "production signing key secret is required" >&2; exit 1; }
          test -n "$LINKLAKE_RELEASE_SIGNING_KEY_ID" || { echo "production signing key ID secret is required" >&2; exit 1; }
          cargo run --locked -p linklake-update --bin linklake-release-sign -- \
            generate --dist dist --version "$RELEASE_VERSION" \
            --key-id "$LINKLAKE_RELEASE_SIGNING_KEY_ID" \
            --minimum-updater-version 0.8.0-rc.1
      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/linklake-${{ env.RELEASE_VERSION }}-release-subjects.sha256
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/linklake-${{ env.RELEASE_VERSION }}-release-subjects.sha256
          sbom-path: dist/linklake-${{ env.RELEASE_VERSION }}-release.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            release_notice=$'> [!WARNING]\n> Windows packages are intentionally unsigned under the personal open-source release policy for LinkLake. Verify SHA-256, GitHub attestations, Linux OpenPGP where applicable, and the production Ed25519 updater manifest before installation. macOS is source/CI compatible only and has no official release asset or automatic-update channel.\n\n> 根据 LinkLake 的个人开源发布策略，Windows 软件包有意未签名（不使用 Authenticode）。安装前请验证 SHA-256、GitHub Attestation、适用的 Linux OpenPGP 签名和生产 Ed25519 更新清单。macOS 仅保留源码/CI 兼容性，不提供官方发行资产或自动更新通道。'
          else
            release_notice=$'> [!IMPORTANT]\n> Windows packages are intentionally unsigned under the personal open-source release policy for LinkLake. Verify SHA-256, GitHub attestations, Linux OpenPGP where applicable, and the production Ed25519 updater manifest before installation.\n\n> 根据 LinkLake 的个人开源发布策略，Windows 软件包有意未签名（不使用 Authenticode）。安装前请验证 SHA-256、GitHub Attestation、适用的 Linux OpenPGP 签名和生产 Ed25519 更新清单。'
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
            case "$release_id" in
              ''|*[!0-9]*) echo 'existing release has an invalid GitHub database ID' >&2; exit 1 ;;
            esac
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f prerelease=true >/dev/null
            else
              gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
                -f prerelease=false -f make_latest=true >/dev/null
            fi
            existing_notes="$(gh release view "$TAG" --json body --jq .body)"
            if [[ "$existing_notes" != *'Windows packages are intentionally unsigned under the personal open-source release policy for LinkLake'* ]]; then
              if [[ -n "$existing_notes" ]]; then
                existing_notes+=$'\n\n'
              fi
              gh release edit "$TAG" --notes "${existing_notes}${release_notice}" >/dev/null
            fi
          else
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              gh release create "$TAG" \
                --title "LinkLake $TAG" \
                --verify-tag \
                --generate-notes \
                --notes "$release_notice" \
                --prerelease
            else
              gh release create "$TAG" \
                --title "LinkLake $TAG" \
                --verify-tag \
                --generate-notes \
                --notes "$release_notice" \
                --latest
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
