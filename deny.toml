[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# 原因和到期日的唯一来源是 security/exceptions.toml，CI 会校验这里没有遗漏或扩大。
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Transitive through iroh 1.0.3 -> netwatch 0.19.1 -> netlink-packet-core 0.8.1, whose current release still uses the unmaintained paste 1.0.15 proc macro." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部 path 依赖也必须声明精确兼容版本。
allow-wildcard-paths = false
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
