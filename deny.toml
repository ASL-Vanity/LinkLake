[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# 原因和到期日的唯一来源是 security/exceptions.toml，CI 会校验这里没有遗漏或扩大。
ignore = [
    { id = "RUSTSEC-2026-0118", reason = "Transitive through iroh 0.92.0 -> hickory-resolver 0.25.2; no compatible stable patched release is available, so the iroh/hickory upgrade must be tracked upstream." },
    { id = "RUSTSEC-2026-0119", reason = "Transitive through iroh 0.92.0 -> hickory-resolver 0.25.2; the fix requires hickory-proto >=0.26.1 and an upstream iroh dependency update outside this baseline branch." },
    { id = "RUSTSEC-2023-0089", reason = "Unmaintained transitive dependency through iroh metrics/relay -> postcard -> heapless; remove it by upgrading the iroh dependency chain." },
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained transitive dependency from iroh 0.92.0; remove it by upgrading iroh after compatibility validation." },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained transitive dependency through iroh 0.92.0 -> stun-rs; remove it by upgrading the upstream networking stack." },
    { id = "RUSTSEC-2025-0134", reason = "Unmaintained direct and axum-server dependency; migrate PEM parsing and upgrade axum-server in a dedicated dependency change." },
    { id = "RUSTSEC-2026-0002", reason = "Unsound IterMut implementation in lru 0.13.0 via iroh-relay/pkarr; the fix in >=0.16.3 requires an upstream iroh update." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部 path 依赖由同一提交锁定；仍拒绝注册表依赖使用 `*` 版本。
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
