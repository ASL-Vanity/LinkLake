global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/linklake-recording-rules.yml
  - /etc/prometheus/rules/linklake-alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: linklake
    scheme: https
    metrics_path: /api/v1/metrics/prometheus
    authorization:
      credentials_file: /run/secrets/linklake_metrics_token
    # Compose 私有网络内仍使用 TLS。若已部署内部 CA，生产环境应改为 ca_file + server_name 严格校验。
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["linklake:32100"]
