{{- if .Values.ha.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "linklake.fullname" . }}-headless
  labels:
    {{- include "linklake.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "linklake.selectorLabels" . | nindent 4 }}
  ports:
    - name: control
      port: {{ .Values.server.controlPort }}
      targetPort: control
      protocol: TCP
{{- end }}
