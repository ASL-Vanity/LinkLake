{{- $authSecret := required "auth.existingSecret is required" .Values.auth.existingSecret -}}
{{- $managementSecret := required "tls.managementSecret is required" .Values.tls.managementSecret -}}
{{- $controlSecret := required "tls.controlSecret is required" .Values.tls.controlSecret -}}
{{- $backend := lower .Values.storage.backend -}}
{{- $haEnabled := .Values.ha.enabled -}}
{{- if .Values.certificateMaterial.existingSecret -}}
{{- if not .Values.podSecurityContext.fsGroup -}}
{{- fail "certificateMaterial requires podSecurityContext.fsGroup so the non-root init container can read the Secret" -}}
{{- end -}}
{{- range .Values.server.extraEnv -}}
{{- if eq .name "LINKLAKE_CERTIFICATE_KEY_FILE" -}}
{{- fail "Do not override LINKLAKE_CERTIFICATE_KEY_FILE in extraEnv when certificateMaterial.existingSecret is configured" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq $backend "sqlite") (ne (int .Values.replicaCount) 1) -}}
{{- fail "replicaCount must be 1 when storage.backend=sqlite" -}}
{{- end -}}
{{- if and $haEnabled (ne $backend "postgres") -}}
{{- fail "ha.enabled requires storage.backend=postgres" -}}
{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $haEnabled) -}}
{{- fail "replicaCount greater than 1 requires ha.enabled=true" -}}
{{- end -}}
{{- if and $haEnabled (or (not .Values.persistence.data.enabled) .Values.persistence.data.existingClaim) -}}
{{- fail "HA requires per-Pod data PVCs: persistence.data.enabled=true and existingClaim empty" -}}
{{- end -}}
{{- if and $haEnabled .Values.persistence.logs.existingClaim -}}
{{- fail "HA requires an empty persistence.logs.existingClaim so every Pod receives an independent log volume" -}}
{{- end -}}
{{- if gt (int .Values.ha.leaderLeaseSeconds) (int .Values.ha.memberLeaseSeconds) -}}
{{- fail "ha.leaderLeaseSeconds must not exceed ha.memberLeaseSeconds" -}}
{{- end -}}
{{- if or (ge (int .Values.ha.heartbeatSeconds) (int .Values.ha.memberLeaseSeconds)) (ge (int .Values.ha.heartbeatSeconds) (int .Values.ha.leaderLeaseSeconds)) (ge (int .Values.ha.heartbeatSeconds) (int .Values.ha.resourceLeaseSeconds)) (ge (int .Values.ha.heartbeatSeconds) (int .Values.ha.jobLeaseSeconds)) -}}
{{- fail "ha.heartbeatSeconds must be lower than every configured HA lease" -}}
{{- end -}}
{{- $postgresSecret := "" -}}
{{- if eq $backend "postgres" -}}
{{- $postgresSecret = required "storage.postgres.existingSecret is required for PostgreSQL" .Values.storage.postgres.existingSecret -}}
{{- if not .Values.persistence.data.enabled -}}
{{- fail "PostgreSQL requires persistence.data.enabled=true for durable per-instance accounting" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $haEnabled }}
metadata:
  name: {{ include "linklake.fullname" . }}
  labels:
    {{- include "linklake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $haEnabled }}
  serviceName: {{ include "linklake.fullname" . }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: {{ .Values.ha.updateStrategy.partition }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.ha.pvcRetention.whenDeleted }}
    whenScaled: {{ .Values.ha.pvcRetention.whenScaled }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "linklake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linklake.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "linklake.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.certificateMaterial.existingSecret }}
      initContainers:
        - name: prepare-certificate-material
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cat /certificate-source/key > /certificate-material/key.pending
              test "$(wc -c < /certificate-material/key.pending)" -eq 32 || { rm -f /certificate-material/key.pending; echo 'Certificate material key must contain exactly 32 bytes' >&2; exit 1; }
              chmod 0600 /certificate-material/key.pending
              mv /certificate-material/key.pending /certificate-material/key
          volumeMounts:
            - name: certificate-material-source
              mountPath: /certificate-source
              readOnly: true
            - name: certificate-material
              mountPath: /certificate-material
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: linklake-server
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.certificateMaterial.existingSecret }}
            - name: LINKLAKE_CERTIFICATE_KEY_FILE
              value: /etc/linklake/certificate-material/key
            {{- end }}
            - name: LINKLAKE_BIND
              value: "0.0.0.0:{{ .Values.server.managementPort }}"
            - name: LINKLAKE_CONTROL_BIND
              value: "0.0.0.0:{{ .Values.server.controlPort }}"
            - name: LINKLAKE_DATA_DIR
              value: /var/lib/linklake
            - name: LINKLAKE_LOG_DIR
              value: /var/log/linklake
            - name: LINKLAKE_PUBLIC_PORT_RANGES
              value: {{ .Values.server.publicPortRanges | quote }}
            - name: LINKLAKE_RESERVED_TCP_PORTS
              value: {{ .Values.server.reservedTcpPorts | quote }}
            - name: LINKLAKE_RESERVED_UDP_PORTS
              value: {{ .Values.server.reservedUdpPorts | quote }}
            - name: LINKLAKE_UDP_PUBLIC_BIND_MODE
              value: {{ .Values.server.udpPublicBindMode | quote }}
            - name: LINKLAKE_STORAGE_BACKEND
              value: {{ $backend | quote }}
            {{- if eq $backend "postgres" }}
            - name: LINKLAKE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecret }}
                  key: {{ .Values.storage.postgres.urlKey }}
            - name: LINKLAKE_POSTGRES_POOL_SIZE
              value: {{ .Values.storage.postgres.poolSize | quote }}
            - name: LINKLAKE_POSTGRES_ACQUIRE_TIMEOUT_SECONDS
              value: {{ .Values.storage.postgres.acquireTimeoutSeconds | quote }}
            - name: LINKLAKE_POSTGRES_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.storage.postgres.connectTimeoutSeconds | quote }}
            - name: LINKLAKE_POSTGRES_HEALTH_TIMEOUT_SECONDS
              value: {{ .Values.storage.postgres.healthTimeoutSeconds | quote }}
            - name: LINKLAKE_POSTGRES_ALLOW_INSECURE_LOOPBACK
              value: {{ .Values.storage.postgres.allowInsecureLoopback | quote }}
            - name: LINKLAKE_HA_REPLICATED_STATE
              value: "true"
            - name: LINKLAKE_HA_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LINKLAKE_HA_MEMBER_LEASE_SECONDS
              value: {{ .Values.ha.memberLeaseSeconds | quote }}
            - name: LINKLAKE_HA_LEADER_LEASE_SECONDS
              value: {{ .Values.ha.leaderLeaseSeconds | quote }}
            - name: LINKLAKE_HA_HEARTBEAT_SECONDS
              value: {{ .Values.ha.heartbeatSeconds | quote }}
            - name: LINKLAKE_HA_RESOURCE_LEASE_SECONDS
              value: {{ .Values.ha.resourceLeaseSeconds | quote }}
            - name: LINKLAKE_HA_JOB_LEASE_SECONDS
              value: {{ .Values.ha.jobLeaseSeconds | quote }}
            {{- end }}
            - name: LINKLAKE_MANAGEMENT_CERT_PATH
              value: /etc/linklake/management/tls.crt
            - name: LINKLAKE_MANAGEMENT_KEY_PATH
              value: /etc/linklake/management/tls.key
            - name: LINKLAKE_CONTROL_CERT_PATH
              value: /etc/linklake/control/tls.crt
            - name: LINKLAKE_CONTROL_KEY_PATH
              value: /etc/linklake/control/tls.key
            - name: LINKLAKE_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ .Values.auth.enrollmentTokenKey }}
            - name: LINKLAKE_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ .Values.auth.adminUsernameKey }}
            - name: LINKLAKE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ .Values.auth.adminPasswordKey }}
            - name: LINKLAKE_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ .Values.auth.managementTokenKey }}
                  optional: true
            {{- if .Values.server.http.enabled }}
            - name: LINKLAKE_HTTP_BIND
              value: "0.0.0.0:{{ .Values.server.http.port }}"
            {{- end }}
            {{- if .Values.server.https.enabled }}
            - name: LINKLAKE_HTTPS_BIND
              value: "0.0.0.0:{{ .Values.server.https.port }}"
            {{- end }}
            {{- if .Values.server.sni.enabled }}
            - name: LINKLAKE_TLS_PASSTHROUGH_BIND
              value: "0.0.0.0:{{ .Values.server.sni.port }}"
            {{- end }}
            {{- if .Values.server.udpRelay.enabled }}
            - name: LINKLAKE_UDP_RELAY_BIND
              value: "0.0.0.0:{{ .Values.server.udpRelay.port }}"
            - name: LINKLAKE_UDP_RELAY_ENDPOINT
              value: {{ required "server.udpRelay.advertisedEndpoint is required when UDP relay is enabled" .Values.server.udpRelay.advertisedEndpoint | quote }}
            - name: LINKLAKE_UDP_RELAY_SERVER_NAME
              value: {{ required "server.udpRelay.serverName is required when UDP relay is enabled" .Values.server.udpRelay.serverName | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: management
              containerPort: {{ .Values.server.managementPort }}
              protocol: TCP
            - name: control
              containerPort: {{ .Values.server.controlPort }}
              protocol: TCP
            {{- if .Values.server.http.enabled }}
            - name: http
              containerPort: {{ .Values.server.http.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.server.https.enabled }}
            - name: https
              containerPort: {{ .Values.server.https.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.server.udpRelay.enabled }}
            - name: udp-relay
              containerPort: {{ .Values.server.udpRelay.port }}
              protocol: UDP
            {{- end }}
            {{- if .Values.server.sni.enabled }}
            - name: sni
              containerPort: {{ .Values.server.sni.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /startupz
              port: management
              scheme: HTTPS
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
              scheme: HTTPS
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: management
              scheme: HTTPS
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.certificateMaterial.existingSecret }}
            - name: certificate-material
              mountPath: /etc/linklake/certificate-material
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /var/lib/linklake
            - name: logs
              mountPath: /var/log/linklake
            - name: tmp
              mountPath: /tmp
            - name: management-tls
              mountPath: /etc/linklake/management
              readOnly: true
            - name: control-tls
              mountPath: /etc/linklake/control
              readOnly: true
      volumes:
        {{- if .Values.certificateMaterial.existingSecret }}
        - name: certificate-material-source
          secret:
            secretName: {{ .Values.certificateMaterial.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.certificateMaterial.key | quote }}
                path: key
        - name: certificate-material
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if or (not $haEnabled) (not .Values.persistence.data.enabled) }}
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "linklake.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if or (not $haEnabled) (not .Values.persistence.logs.enabled) }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "linklake.logsClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: management-tls
          secret:
            secretName: {{ $managementSecret }}
        - name: control-tls
          secret:
            secretName: {{ $controlSecret }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $haEnabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.data.accessModes | nindent 10 }}
        {{- with .Values.persistence.data.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
    {{- if .Values.persistence.logs.enabled }}
    - metadata:
        name: logs
      spec:
        accessModes:
          {{- toYaml .Values.persistence.logs.accessModes | nindent 10 }}
        {{- with .Values.persistence.logs.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.logs.size }}
    {{- end }}
  {{- end }}
