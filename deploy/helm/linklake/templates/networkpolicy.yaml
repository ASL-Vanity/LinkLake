{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "linklake.fullname" . }}
  labels:
    {{- include "linklake.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "linklake.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.server.controlPort }}
          protocol: TCP
        {{- if .Values.server.http.enabled }}
        - port: {{ .Values.server.http.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.server.https.enabled }}
        - port: {{ .Values.server.https.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.server.udpRelay.enabled }}
        - port: {{ .Values.server.udpRelay.port }}
          protocol: UDP
        {{- end }}
        {{- if .Values.server.sni.enabled }}
        - port: {{ .Values.server.sni.port }}
          protocol: TCP
        {{- end }}
        {{- range .Values.services.data.publicTcpPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        {{- range .Values.services.data.publicUdpPorts }}
        - port: {{ . }}
          protocol: UDP
        {{- end }}
    {{- with .Values.networkPolicy.managementFrom }}
    -
      from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.server.managementPort }}
          protocol: TCP
    {{- end }}
{{- end }}
