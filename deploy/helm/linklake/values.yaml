replicaCount: 1

storage:
  # PostgreSQL 保存共享业务状态；每个副本的 PVC 保存独立实例标识及待确认流量账务。
  backend: sqlite
  postgres:
    existingSecret: ""
    urlKey: postgres-url
    poolSize: 16
    acquireTimeoutSeconds: 5
    connectTimeoutSeconds: 10
    healthTimeoutSeconds: 5
    allowInsecureLoopback: false
    # 兼容旧 values 的弃用开关；不再要求外部复制本机数据库。
    replicatedStateAcknowledged: false

ha:
  enabled: false
  memberLeaseSeconds: 30
  leaderLeaseSeconds: 15
  heartbeatSeconds: 5
  resourceLeaseSeconds: 15
  jobLeaseSeconds: 30
  updateStrategy:
    partition: 0
  pvcRetention:
    whenDeleted: Retain
    whenScaled: Retain

image:
  repository: ghcr.io/asl-vanity/linklake
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

auth:
  # 该 Secret 必须由部署方预先创建，Chart 不接受或渲染明文凭据。
  existingSecret: ""
  enrollmentTokenKey: enrollment-token
  adminUsernameKey: admin-username
  adminPasswordKey: admin-password
  managementTokenKey: management-token

tls:
  # 两个 Secret 均使用标准 kubernetes.io/tls 的 tls.crt / tls.key。
  managementSecret: ""
  controlSecret: ""

certificateMaterial:
  # 引用已有 Secret 中的 32 字节二进制密钥；所有 PostgreSQL 副本必须相同。
  existingSecret: ""
  key: certificate-key

server:
  managementPort: 32100
  controlPort: 32101
  http:
    enabled: true
    port: 32102
  https:
    enabled: true
    port: 32103
  udpRelay:
    enabled: true
    port: 32104
    advertisedEndpoint: relay.example.com:32104
    serverName: relay.example.com
  sni:
    enabled: true
    port: 32105
  publicPortRanges: 1024-65535
  reservedTcpPorts: 22,32100-32105
  reservedUdpPorts: 53,32104
  udpPublicBindMode: auto
  extraEnv: []

services:
  management:
    type: ClusterIP
    annotations: {}
  data:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    publicTcpPorts: []
    publicUdpPorts: []

persistence:
  data:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
    retainOnDelete: true
  logs:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
    retainOnDelete: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi

probes:
  startup:
    failureThreshold: 60
    periodSeconds: 2
    timeoutSeconds: 2
  readiness:
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 2
  liveness:
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

terminationGracePeriodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  managementFrom: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    insecureSkipVerify: false
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
