[workspace]
resolver = "2"
members = [
    "crates/linklake-core",
    "crates/linklake-server",
    "crates/linklake-client",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["LinkLake Contributors"]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
arc-swap = "1.7"
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.38", features = ["io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tracing-appender = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-service = "0.8"
x509-parser = "0.18"
