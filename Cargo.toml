[workspace]
resolver = "2"
members = [
    "crates/linklake-core",
    "crates/linklake-update",
    "crates/linklake-server",
    "crates/linklake-client",
]

[workspace.package]
version = "0.8.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ASL-Vanity/LinkLake"
authors = ["LinkLake Contributors"]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
arc-swap = "1.7"
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.12"
flate2 = "1.1"
getrandom = "0.4"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
hmac = "0.12"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
iroh = { version = "0.92.0", default-features = false }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
snow = "0.10"
tar = "0.4"
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.38", features = ["io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tracing-appender = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-service = "0.8"
x509-parser = "0.18"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
