<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkLake Management</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #07131f; color: #e8f2f7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, #123456, #07131f 52%); }
      main { width: min(1040px, calc(100% - 48px)); margin: 24px 0; padding: 42px; border: 1px solid #22506b; border-radius: 18px; background: rgba(8, 25, 39, .9); box-shadow: 0 24px 72px #0008; }
      .top { display: flex; justify-content: space-between; gap: 18px; align-items: center; }
      .mark { color: #43d9dd; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(32px, 7vw, 60px); }
      h2 { margin: 0 0 16px; color: #8ceef0; font-size: 20px; }
      p { color: #a9c4d1; line-height: 1.7; }
      section { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 28px; }
      article { padding: 16px; border-radius: 12px; background: #0b2234; }
      strong { display: block; color: #43d9dd; font-size: 24px; }
      #audit, #tunnel-list, #http-route-list { grid-template-columns: 1fr; }
      #audit article, #tunnel-list article, #http-route-list article { display: grid; gap: 4px; }
      #audit strong, #tunnel-list strong, #http-route-list strong { font-size: 15px; }
      .audit-detail, .policy-detail { color: #a9c4d1; overflow-wrap: anywhere; }
      .management-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 28px; }
      .management-grid > article { align-self: start; }
      .policy-list { margin-top: 12px; }
      .policy-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .policy-actions button { padding: 7px 10px; }
      form { display: grid; gap: 10px; width: min(460px, 100%); }
      label { display: grid; gap: 5px; color: #a9c4d1; font-size: 13px; }
      input, select, button { box-sizing: border-box; padding: 12px; border-radius: 9px; font: inherit; }
      input, select { width: 100%; color: #e8f2f7; background: #06101a; border: 1px solid #3a718b; }
      button { cursor: pointer; color: #022128; border: 0; background: #43d9dd; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .65; }
      #language { padding: 8px 12px; background: transparent; border: 1px solid #43d9dd; color: #8ceef0; }
      #message { min-height: 24px; color: #a9c4d1; }
      .error { color: #ff9f9f !important; }
      .hidden { display: none; }
      @media (max-width: 760px) { main { padding: 28px; } .management-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div class="mark" data-i18n="managementPlane">LinkLake / management plane</div>
        <button id="language" type="button">ZH</button>
      </div>
      <h1 data-i18n="heading">Control plane online.</h1>
      <p data-i18n="intro">Sign in with an administrator account. Passwords and session secrets stay out of browser scripts.</p>
      <form id="login">
        <label><span data-i18n="usernameLabel">Username</span><input id="username" type="text" autocomplete="username" data-placeholder="username" placeholder="Administrator username" required /></label>
        <label><span data-i18n="passwordLabel">Password</span><input id="password" type="password" autocomplete="current-password" data-placeholder="password" placeholder="Password" required /></label>
        <button type="submit" data-i18n="signIn">Sign in</button>
      </form>
      <form id="change-password" class="hidden">
        <label><span data-i18n="newPasswordLabel">New password</span><input id="new-password" type="password" autocomplete="new-password" data-placeholder="newPassword" placeholder="New password (at least 12 characters)" required /></label>
        <label><span data-i18n="confirmPasswordLabel">Confirm password</span><input id="confirm-password" type="password" autocomplete="new-password" data-placeholder="confirmPassword" placeholder="Confirm new password" required /></label>
        <button type="submit" data-i18n="changePassword">Change password</button>
      </form>
      <p id="message" aria-live="polite"></p>
      <section id="status" class="hidden"></section>
      <section id="metrics" class="hidden"></section>
      <section id="audit" class="hidden"></section>
      <div id="policy-management" class="management-grid hidden">
        <article>
          <h2 data-i18n="tcpPolicy">TCP tunnel policy</h2>
          <form id="tunnel-form">
            <label><span data-i18n="client">Client</span><select id="tunnel-client-id" required></select></label>
            <label><span data-i18n="tunnelNameLabel">Tunnel name</span><input id="tunnel-name" data-placeholder="tunnelName" placeholder="Tunnel name" required /></label>
            <label><span data-i18n="publicPortLabel">Public port</span><input id="tunnel-port" type="number" min="32000" max="32999" data-placeholder="publicPort" placeholder="Public port" required /></label>
            <label><span data-i18n="targetAddressLabel">Target address</span><input id="tunnel-target" data-placeholder="targetAddress" placeholder="Target address, e.g. 127.0.0.1:2333" required /></label>
            <label><span data-i18n="maxConnectionsLabel">Max connections</span><input id="tunnel-max" type="number" min="1" max="1024" value="64" data-placeholder="maxConnections" placeholder="Max connections" required /></label>
            <label><span data-i18n="bandwidthLimitLabel">Bandwidth limit</span><input id="tunnel-bandwidth" type="number" min="1024" max="1000000000" data-placeholder="bandwidthLimit" placeholder="Aggregate bandwidth limit (B/s, optional)" /></label>
            <button type="submit" data-i18n="createTunnel">Create TCP policy</button>
          </form>
          <section id="tunnel-list" class="policy-list"></section>
        </article>
        <article>
          <h2 data-i18n="httpRoutePolicy">HTTP host route</h2>
          <form id="http-route-form">
            <label><span data-i18n="client">Client</span><select id="http-route-client-id" required></select></label>
            <label><span data-i18n="routeNameLabel">Route name</span><input id="http-route-name" data-placeholder="routeName" placeholder="Route name" required /></label>
            <label><span data-i18n="hostnameLabel">Hostname</span><input id="http-route-hostname" data-placeholder="hostname" placeholder="Hostname, e.g. app.example.com" required /></label>
            <label><span data-i18n="targetAddressLabel">Target address</span><input id="http-route-target" data-placeholder="httpTargetAddress" placeholder="Target address, e.g. 127.0.0.1:8080" required /></label>
            <label><span data-i18n="maxConnectionsLabel">Max connections</span><input id="http-route-max" type="number" min="1" max="1024" value="64" data-placeholder="maxConnections" placeholder="Max connections" required /></label>
            <button type="submit" data-i18n="createHttpRoute">Create HTTP route</button>
          </form>
          <section id="http-route-list" class="policy-list"></section>
        </article>
      </div>
    </main>

        }
      };

      const elements = {
        loginForm: document.querySelector('#login'), changeForm: document.querySelector('#change-password'), username: document.querySelector('#username'), password: document.querySelector('#password'), newPassword: document.querySelector('#new-password'), confirmPassword: document.querySelector('#confirm-password'), message: document.querySelector('#message'), status: document.querySelector('#status'), metrics: document.querySelector('#metrics'), audit: document.querySelector('#audit'), policyManagement: document.querySelector('#policy-management'), tunnelForm: document.querySelector('#tunnel-form'), tunnelList: document.querySelector('#tunnel-list'), tunnelClient: document.querySelector('#tunnel-client-id'), httpRouteForm: document.querySelector('#http-route-form'), httpRouteList: document.querySelector('#http-route-list'), httpRouteClient: document.querySelector('#http-route-client-id'), languageButton: document.querySelector('#language')
      };
      let language = localStorage.getItem('linklake-language') || (navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en');
      let dashboard = null;
      let refreshTimer = null;

      function text(key) { return words[language][key] || key; }
      function setMessage(key, values = {}, error = false) {
        elements.message.className = error ? 'error' : '';
        elements.message.dataset.key = key;
        elements.message.dataset.values = JSON.stringify(values);
        elements.message.textContent = text(key).replace('{time}', values.time || '');
      }
      function applyLanguage() {
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.title = text('title');
        elements.languageButton.textContent = text('toggle');
        document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = text(element.dataset.i18n); });
        document.querySelectorAll('[data-placeholder]').forEach(element => { element.placeholder = text(element.dataset.placeholder); });
        if (!elements.message.textContent) setMessage('waiting');
        else if (elements.message.dataset.key) setMessage(elements.message.dataset.key, JSON.parse(elements.message.dataset.values || '{}'), elements.message.classList.contains('error'));
        if (dashboard) renderDashboard();
      }
      function addCard(container, headline, caption, detail) {
        const article = document.createElement('article');
        const strong = document.createElement('strong');
        const span = document.createElement('span');
        strong.textContent = headline;
        span.textContent = caption;
        article.append(strong, span);
        if (detail) {
          const extra = document.createElement('span');
          extra.className = 'audit-detail';
          extra.textContent = detail;
          article.append(extra);
        }
        container.append(article);
      }
      function formatBytes(value) {
        if (value < 1024) return `${value} B`;
        if (value < 1048576) return `${(value / 1024).toFixed(1)} KiB`;
        return `${(value / 1048576).toFixed(1)} MiB`;
      }
      function formatRate(value) { return value ? `${formatBytes(value)}/s` : text('unlimited'); }
      function auditText(event) {
        const actions = {
          'management.login': 'auditLogin', 'management.login.failed': 'auditLoginFailed', 'management.password.changed': 'auditPasswordChanged', 'management.logout': 'auditLogout', 'client.enrolled': 'auditClientEnrolled', 'tcp_tunnel.registered': 'auditTunnelRegistered', 'tcp_tunnel.policy.created': 'auditTcpCreated', 'tcp_tunnel.policy.updated': 'auditTcpUpdated', 'tcp_tunnel.policy.deleted': 'auditTcpDeleted', 'http_route.registered': 'auditHttpRegistered', 'http_route.policy.created': 'auditHttpCreated', 'http_route.policy.updated': 'auditHttpUpdated', 'http_route.policy.deleted': 'auditHttpDeleted'
        };
        const details = { 'session created': 'auditSessionCreated', 'password updated': 'auditPasswordUpdated', enabled: 'auditEnabled', disabled: 'auditDisabled', 'policy deleted': 'auditPolicyDeleted' };
        return { action: actions[event.action] ? text(actions[event.action]) : event.action, detail: details[event.detail] ? text(details[event.detail]) : event.detail };
      }
      function renderClientOptions(select) {
        const selected = select.value;
        select.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = dashboard.clients.length ? text('selectClient') : text('noClients');
        placeholder.disabled = true;
        placeholder.selected = true;
        select.append(placeholder);
        dashboard.clients.forEach(client => {
          const option = document.createElement('option');
          option.value = client.client_id;
          option.textContent = `${client.name} (${client.platform}) · ${client.client_id}`;
          select.append(option);
        });
        if (dashboard.clients.some(client => client.client_id === selected)) select.value = selected;
      }
      function addPolicyCard(container, titleText, detailText, enabled, onToggle, onDelete) {
        const article = document.createElement('article');
        const title = document.createElement('strong');
        const detail = document.createElement('span');
        const actions = document.createElement('div');
        title.textContent = titleText;
        detail.className = 'policy-detail';
        detail.textContent = detailText;
        actions.className = 'policy-actions';
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.textContent = enabled ? text('disable') : text('enable');
        toggle.onclick = onToggle;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = text('delete');
        remove.onclick = onDelete;
        actions.append(toggle, remove);
        article.append(title, detail, actions);
        container.append(article);
      }
      function renderDashboard() {
        elements.status.replaceChildren();
        elements.metrics.replaceChildren();
        elements.audit.replaceChildren();
        elements.tunnelList.replaceChildren();
        elements.httpRouteList.replaceChildren();
        renderClientOptions(elements.tunnelClient);
        renderClientOptions(elements.httpRouteClient);

        addCard(elements.status, dashboard.status.api_version, text('api'));
        addCard(elements.status, String(dashboard.status.clients), text('clients'));
        addCard(elements.status, String(dashboard.tcpPolicies.length), text('tunnels'));
        addCard(elements.status, String(dashboard.httpRoutes.length), text('httpRoutes'));
        elements.status.classList.remove('hidden');

        addCard(elements.metrics, String(dashboard.metrics.tcp_active_connections), text('activeConnections'));
        addCard(elements.metrics, String(dashboard.metrics.tcp_pending_connections), text('pendingPairs'));
        addCard(elements.metrics, `${formatBytes(dashboard.metrics.tcp_bytes_from_public)} / ${formatBytes(dashboard.metrics.tcp_bytes_to_public)}`, text('traffic'));
        addCard(elements.metrics, String(dashboard.metrics.tunnel_reconnects_total), text('reconnects'));
        addCard(elements.metrics, String(dashboard.metrics.authentication_failures_total), text('authFailures'));
        addCard(elements.metrics, `${dashboard.metrics.uptime_seconds} ${text('seconds')}`, text('uptime'));
        elements.metrics.classList.remove('hidden');

        if (dashboard.events.length === 0) addCard(elements.audit, text('auditEmpty'), '');
        else dashboard.events.forEach(event => {
          const translated = auditText(event);
          addCard(elements.audit, `${translated.action} - ${new Date(event.occurred_unix_seconds * 1000).toLocaleString(language)}`, event.subject, translated.detail);
        });
        elements.audit.classList.remove('hidden');

        if (dashboard.tcpPolicies.length === 0) addCard(elements.tunnelList, text('noTunnels'), '');
        else dashboard.tcpPolicies.forEach(policy => {
          const title = `${policy.name} :${policy.public_port} (${policy.enabled ? text('enabled') : text('disabled')}, ${policy.online ? text('online') : text('offline')})`;
          const detail = `${policy.client_id} -> ${policy.target_addr} | ${policy.active_connections}/${policy.max_connections} ${text('active')} | ${policy.rejected_connections} ${text('rejected')} (${text('limitBreakdown')}: ${policy.rejected_policy_limit}/${policy.rejected_global_limit}/${policy.rejected_pending_limit}) | ${formatBytes(policy.bytes_from_public)} / ${formatBytes(policy.bytes_to_public)} | ${policy.failed_connections} ${text('failed')} (${text('errorBreakdown')}: ${policy.pairing_timeouts}/${policy.transfer_errors}/${policy.lifetime_timeouts}) | ${text('bandwidth')}: ${formatRate(policy.bandwidth_limit_bps)}`;
          addPolicyCard(elements.tunnelList, title, detail, policy.enabled, () => updatePolicy('tcp-tunnels', policy.id, !policy.enabled, 'tunnelRequestFailed'), () => deletePolicy('tcp-tunnels', policy.id, 'confirmDeleteTcp', 'tunnelRequestFailed'));
        });

        if (dashboard.httpRoutes.length === 0) addCard(elements.httpRouteList, text('noHttpRoutes'), '', text('httpFirstStage'));
        else dashboard.httpRoutes.forEach(route => {
          const title = `${route.name} · http://${route.hostname} (${route.enabled ? text('enabled') : text('disabled')}, ${route.online ? text('online') : text('offline')})`;
          const detail = `${route.client_id} -> ${route.target_addr} | ${route.active_connections}/${route.max_connections} ${text('active')} | ${route.requests_total} ${text('requests')} | ${route.failed_requests} ${text('failed')} | ${formatBytes(route.bytes_from_public)} / ${formatBytes(route.bytes_to_public)} | ${route.pairing_timeouts} ${text('pairingTimeouts')}`;
          addPolicyCard(elements.httpRouteList, title, detail, route.enabled, () => updatePolicy('http-routes', route.id, !route.enabled, 'httpRouteRequestFailed'), () => deletePolicy('http-routes', route.id, 'confirmDeleteHttp', 'httpRouteRequestFailed'));
        });
        elements.policyManagement.classList.remove('hidden');
      }
      async function readApiError(response, fallbackKey) {
        try {
          const error = await response.json();
          const keys = { unknown_client: 'errorUnknownClient', invalid_name: 'errorInvalidName', invalid_hostname: 'errorInvalidHostname', duplicate_hostname: 'errorDuplicateHostname', invalid_target: 'errorInvalidTarget', invalid_connection_limit: 'errorInvalidConnectionLimit', unknown_http_route: 'errorUnknownHttpRoute' };
          return keys[error.code] || fallbackKey;
        } catch (_) {
          return fallbackKey;
        }
      }
      function resetForExpiredSession() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = null;
        dashboard = null;
        elements.status.classList.add('hidden');
        elements.metrics.classList.add('hidden');
        elements.audit.classList.add('hidden');
        elements.policyManagement.classList.add('hidden');
        elements.loginForm.classList.remove('hidden');
        setMessage('sessionExpired', {}, true);
      }
      async function loadManagementData() {
        const responses = await Promise.all(['/api/v1/status', '/api/v1/metrics', '/api/v1/audit?limit=10', '/api/v1/tcp-tunnels', '/api/v1/http-routes', '/api/v1/clients'].map(url => fetch(url)));
        if (responses.some(response => response.status === 401)) {
          resetForExpiredSession();
          throw new Error(text('sessionExpired'));
        }
        if (responses.some(response => !response.ok)) throw new Error(text('statusFailed'));
        const [statusData, metricsData, events, tcpPolicies, httpRoutes, clients] = await Promise.all(responses.map(response => response.json()));
        dashboard = { status: statusData, metrics: metricsData, events, tcpPolicies, httpRoutes, clients };
        renderDashboard();
      }
      function startAutoRefresh() {
        if (!refreshTimer) refreshTimer = setInterval(() => loadManagementData().catch(() => {}), 5000);
      }
      async function updatePolicy(resource, id, enabled, fallbackKey) {
        const response = await fetch(`/api/v1/${resource}/${id}/enabled`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled }) });
        if (response.status === 401) return resetForExpiredSession();
        if (!response.ok) return setMessage(await readApiError(response, fallbackKey), {}, true);
        await loadManagementData();
      }
      async function deletePolicy(resource, id, confirmationKey, fallbackKey) {
        if (!window.confirm(text(confirmationKey))) return;
        const response = await fetch(`/api/v1/${resource}/${id}`, { method: 'DELETE' });
        if (response.status === 401) return resetForExpiredSession();
        if (!response.ok) return setMessage(await readApiError(response, fallbackKey), {}, true);
        await loadManagementData();
      }

      elements.languageButton.addEventListener('click', () => {
        language = language === 'zh' ? 'en' : 'zh';
        localStorage.setItem('linklake-language', language);
        applyLanguage();
      });
      elements.loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        setMessage('signingIn');
        const submit = event.submitter;
        submit.disabled = true;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch('/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: elements.username.value, password: elements.password.value }), signal: controller.signal });
          elements.password.value = '';
          if (!response.ok) return setMessage('signInFailed', {}, true);
          const login = await response.json();
          elements.loginForm.classList.add('hidden');
          if (login.password_change_required) {
            elements.changeForm.classList.remove('hidden');
            setMessage('changeRequired');
            return;
          }
          await loadManagementData();
          startAutoRefresh();
          setMessage('signedIn', { time: new Date(login.expires_unix_seconds * 1000).toLocaleString(language) });
        } catch (_) {
          setMessage('requestFailed', {}, true);
        } finally {
          clearTimeout(timeout);
          submit.disabled = false;
        }
      });
      elements.changeForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (elements.newPassword.value !== elements.confirmPassword.value) return setMessage('passwordsMismatch', {}, true);
        setMessage('changingPassword');
        const submit = event.submitter;
        submit.disabled = true;
        try {
          const response = await fetch('/api/v1/auth/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ new_password: elements.newPassword.value }) });
          elements.newPassword.value = '';
          elements.confirmPassword.value = '';
          if (!response.ok) return setMessage('passwordChangeFailed', {}, true);
          elements.changeForm.classList.add('hidden');
          await loadManagementData();
          startAutoRefresh();
          setMessage('passwordChanged');
        } catch (_) {
          setMessage('requestFailed', {}, true);
        } finally {
          submit.disabled = false;
        }
      });
      elements.tunnelForm.addEventListener('submit', async event => {
        event.preventDefault();
        const submit = event.submitter;
        submit.disabled = true;
        const bandwidth = document.querySelector('#tunnel-bandwidth').value;
        try {
          const response = await fetch('/api/v1/tcp-tunnels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: elements.tunnelClient.value, name: document.querySelector('#tunnel-name').value, public_port: Number(document.querySelector('#tunnel-port').value), target_addr: document.querySelector('#tunnel-target').value, max_connections: Number(document.querySelector('#tunnel-max').value), bandwidth_limit_bps: bandwidth ? Number(bandwidth) : null }) });
          if (response.status === 401) return resetForExpiredSession();
          if (!response.ok) return setMessage('tunnelRequestFailed', {}, true);
          elements.tunnelForm.reset();
          await loadManagementData();
        } catch (_) {
          setMessage('requestFailed', {}, true);
        } finally {
          submit.disabled = false;
        }
      });
      elements.httpRouteForm.addEventListener('submit', async event => {
        event.preventDefault();
        const submit = event.submitter;
        submit.disabled = true;
        try {
          const response = await fetch('/api/v1/http-routes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: elements.httpRouteClient.value, name: document.querySelector('#http-route-name').value, hostname: document.querySelector('#http-route-hostname').value, target_addr: document.querySelector('#http-route-target').value, max_connections: Number(document.querySelector('#http-route-max').value) }) });
          if (response.status === 401) return resetForExpiredSession();
          if (!response.ok) return setMessage(await readApiError(response, 'httpRouteRequestFailed'), {}, true);
          elements.httpRouteForm.reset();
          await loadManagementData();
        } catch (_) {
          setMessage('requestFailed', {}, true);
        } finally {
          submit.disabled = false;
        }
      });
      applyLanguage();
    </script>
  </body>
</html>
